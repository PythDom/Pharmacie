name: Update medicines database (SAM v2)

on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download SAM v2 full export
        run: |
          BASE=https://www.vas.ehealth.fgov.be/websamcivics/samcivics/download
          VERSION=$(curl -sf "$BASE/samv2-full-getLastVersion?xsd=6")
          echo "SAM version: $VERSION"
          echo "SAM_VERSION=$VERSION" >> "$GITHUB_ENV"
          curl -sfL --retry 3 -o sam.zip "$BASE/samv2-download?type=FULL&xsd=6&version=$VERSION"
      - name: Build lookup tables
        run: python scripts/build_db.py sam.zip data "$SAM_VERSION"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ignore the version/date header: only commit when actual rows changed.
          if git diff --quiet -I '^\{"v"' -- data; then echo "No changes"; exit 0; fi
          git add data
          git commit -m "Update medicines DB (SAM $SAM_VERSION)"
          git push
