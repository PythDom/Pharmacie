plugins {
    id "com.android.application"
}

// Version et signature fournies par la GitHub Action (voir .github/workflows/android.yml).
def env = System.getenv()

android {
    namespace "io.github.pythdom.pharmacie"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.pythdom.pharmacie"
        minSdk 24
        // 34 : pas d'affichage bord à bord forcé (Android 15), l'interface web reste sous la barre d'état.
        targetSdk 34
        versionCode((env.VERSION_CODE ?: "1") as int)
        versionName env.VERSION_NAME ?: "1.0"
    }

    signingConfigs {
        release {
            if (env.KEYSTORE_FILE) {
                storeFile file(env.KEYSTORE_FILE)
                storeType "pkcs12"
                storePassword env.KEYSTORE_PASSWORD
                keyAlias env.KEY_ALIAS
                keyPassword env.KEYSTORE_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
